name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore xidio/xidio.slnx
      - run: dotnet build xidio/xidio.slnx -c Release --no-restore

  cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore xidio/xidio.CLI/xidio.CLI.csproj
      - run: dotnet build xidio/xidio.CLI/xidio.CLI.csproj -c Release -f net10.0 --no-restore
